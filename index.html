<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лабораторні роботи</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    --card-bg: rgba(30, 41, 59, 0.7);
    --card-hover: rgba(51, 65, 85, 0.9);
    --border-color: rgba(255, 255, 255, 0.08);
    --border-hover: #818cf8;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.25);
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrapper {
    width: 100%;
    max-width: 420px;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    text-align: center;
  }

  .main-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  .sub-title {
    color: var(--text-secondary);
    font-size: 0.95rem;
    margin-bottom: 28px;
  }

  .labs-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .lab-item {
    background: var(--card-bg);
    color: var(--text-primary);
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    font-size: 0.95rem;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.2s ease;
  }

  .lab-item span {
    color: var(--text-primary);
  }

  .arrow {
    color: var(--accent);
    font-weight: bold;
    transition: transform 0.2s ease;
  }

  .lab-item:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    box-shadow: 0 4px 12px var(--accent-glow);
    transform: translateY(-2px);
  }

  .lab-item:hover .arrow {
    transform: translateX(4px);
  }

  .lab-item:active {
    transform: translateY(0);
  }

  .author-info {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
  }
</style>
</head>
<body>

  <div class="wrapper">
    <h1>Привіт!</h1>
    <p class="sub-title">Лабораторні роботи:</p>

    <div class="labs-list">
      <a class="lab-item" href="lab1/index.html">
        <span>Лабораторна 1</span>
        <span class="arrow">➔</span>
      </a>
      <a class="lab-item" href="lab2/index.html">
        <span>Лабораторна 2</span>
        <span class="arrow">➔</span>
      </a>
      <a class="lab-item" href="lab3/index.html">
        <span>Лабораторна 3</span>
        <span class="arrow">➔</span>
      </a>
      <a class="lab-item" href="lab4/index.html">
        <span>Лабораторна 4</span>
        <span class="arrow">➔</span>
      </a>
    </div>

    <div class="author-info">
      Авторка: Сеньків Надія
    </div>
  </div>

</body>
</html>
